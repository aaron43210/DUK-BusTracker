<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA meta -->
    <meta name="theme-color" content="#A2D7C3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DUK Bus" />

    <!-- SEO -->
    <title>DUK Bus Tracker</title>
    <meta name="description" content="Real-time bus tracking for Digital University Kerala students." />

    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" href="/buslogo.png" />
    <link rel="icon" href="/buslogo.png" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- MapLibre GL CSS -->
    <link
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div class="splash-screen" style="position: absolute; inset: 0; z-index: 99999;">
        <div class="splash-overlay"></div>
        <div class="splash-content">
          <div class="splash-loader"></div>
          <div class="splash-text">Loading...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
