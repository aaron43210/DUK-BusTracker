# =============================================================================
# Admin dashboard (/duk/admin2026/) — performance + security config for the
# production nginx (1.18, Ubuntu) on 10.10.35.205.
#
# Merge these into the existing `server { listen 443 ssl ...; }` block in
# /etc/nginx/sites-available/<site>, replacing the current admin location(s).
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# What each part fixes (Lighthouse, Oct 2026):
#   * gzip_types        — JS/CSS were sent uncompressed (nginx gzips only
#                         text/html by default): ~250 KB → ~80 KB on the wire.
#   * http2             — one multiplexed connection instead of HTTP/1.1.
#   * Cache-Control     — "Use efficient cache lifetimes" (assets had none).
#   * /robots.txt       — was proxied to a dead upstream → 502 (SEO audit).
#   * security headers  — CSP / XFO / COOP / HSTS "Trust and Safety" items.
# =============================================================================

# ── 1. server block: enable HTTP/2 ───────────────────────────────────────────
# nginx 1.18 enables HTTP/2 on the listen line (the `http2 on;` directive only
# exists in 1.25.1+). Change the existing line to:
#
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;   # if an IPv6 listener exists

# ── 2. server block: compression ─────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

# ── 3. server block: robots.txt ──────────────────────────────────────────────
# Served directly so it never depends on an upstream. The admin path is
# deliberately NOT listed: robots.txt is public and would advertise it.
location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=86400";
    return 200 "User-agent: *\nDisallow: /api/\n";
}

# ── 4. Admin dashboard locations ─────────────────────────────────────────────
# NOTE: any add_header inside a location disables inheritance of the server
# block's add_header lines, so the security headers are repeated in both
# locations below.

# Hashed build output (Vite puts a content hash in every filename here), so it
# can be cached for a year. `^~` stops regex locations (e.g. a generic
# `~* \.(js|css)$` rule pointing at another root) from hijacking these paths.
location ^~ /duk/admin2026/assets/ {
    alias /opt/admin_dashboard/assets/;
    try_files $uri =404;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# index.html, SPA routes (/duk/admin2026/trips → index.html) and the few
# un-hashed public files. `no-cache` = always revalidate, so a deploy is
# picked up on the next load (ETag makes the revalidation a cheap 304).
location /duk/admin2026/ {
    alias /opt/admin_dashboard/;
    try_files $uri $uri/ /duk/admin2026/index.html;

    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # unpkg.com: MapLibre GL + geocoder (Stops/Dashboard/Route History maps).
    # blob: workers/images: MapLibre spawns its worker from a blob URL.
    # connect-src https:/wss: covers map tiles (openfreemap), geocoding and the
    # live-tracking WebSocket.
    # Trusted Types are intentionally not enforced: the map markers are built
    # with innerHTML (Dashboard.jsx, RouteHistory.jsx).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; child-src blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
