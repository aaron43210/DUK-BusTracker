# =============================================================================
# Passenger PWA (/bus/ios/mobile/) — compression + caching config for the
# production nginx (1.18, Ubuntu) on 10.10.35.205.
#
# Vite builds duk_pwa1 with base '/bus/ios/mobile/' and push_to_server.sh
# rsyncs duk_pwa1/dist/ to /opt/duk_pwa1/, so that URL prefix maps onto that
# directory.
#
# Merge these into the existing `server { listen 443 ssl ...; }` block in
# /etc/nginx/sites-available/<site>, replacing the current /bus/ios/mobile/
# location(s). Then:  sudo nginx -t && sudo systemctl reload nginx
#
# Keep the locations in section 3 in sync with the PWA server block in
# nginx.conf.template (what deploy.sh renders on a fresh server).
#
# Cache policy (Lighthouse "Use efficient cache lifetimes"):
#   assets/*-[hash].js|css          1 year, immutable (name changes per build)
#   png/webp/jpg/gif/svg/ico/mp4/   7 days (public/ files, NOT hashed, so they
#   webm/woff at the PWA root               keep their name across builds)
#   index.html, SPA routes,         no-cache = revalidate on every load; the
#   offline.html, sw.js,            ETag makes that a cheap 304, and a deploy
#   firebase-messaging-sw.js,       is picked up on the next visit. sw.js must
#   manifest.webmanifest            never be cached long or updates stall.
# =============================================================================

# ── 1. server block: enable HTTP/2 ───────────────────────────────────────────
# nginx 1.18 enables HTTP/2 on the listen line (the `http2 on;` directive only
# exists in 1.25.1+). Change the existing line to:
#
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;   # if an IPv6 listener exists

# ── 2. server block: compression ─────────────────────────────────────────────
# Section 2 of nginx-admin-dashboard.conf plus text/javascript and
# image/x-icon. A server block may contain these only ONCE (nginx -t fails on
# a duplicate gzip_types), so if that block or an older gzip block is already
# there, replace it with this one rather than adding a second.
# Brotli is not used: Ubuntu's nginx does not ship ngx_brotli.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml
    image/x-icon;

# ── 3. PWA locations ─────────────────────────────────────────────────────────
# Any add_header inside a location disables inheritance of the server block's
# add_header lines, so the security headers are repeated in every location
# below. If the server block sets other headers (e.g. a CSP), copy those lines
# into each location here as well, or they will stop being sent for the PWA.
#
# `^~` stops server-level regex locations (e.g. a generic
# `~* \.(js|css|png)$ { expires 1y; }` rule pointing at another root) from
# hijacking these paths. Such a rule would cache sw.js for a year.
location ^~ /bus/ios/mobile/ {
    alias /opt/duk_pwa1/;
    index index.html;
    # SPA fallback: client-side routes get index.html.
    try_files $uri $uri/ /bus/ios/mobile/index.html;

    # Default for this tree: index.html, SPA routes, offline.html, other files.
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite build output: every filename carries a content hash.
    # No SPA fallback here: a missing chunk must 404, never come back as
    # index.html (which would then be cached for a year as "JS").
    # Cache-Control has no `always`, so 404s are not cached for a year.
    location ^~ /bus/ios/mobile/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service workers: the browser must revalidate these on every check.
    # Exact matches win over the image regex below and over any server-level
    # `\.js$` regex.
    location = /bus/ios/mobile/sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /bus/ios/mobile/firebase-messaging-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # nginx 1.18's mime.types has no .webmanifest entry (it would go out as
    # application/octet-stream and skip gzip), so set the type here.
    location = /bus/ios/mobile/manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Un-hashed public/ files at the PWA root (icons, logos, splash, video).
    # 7 days: long enough for repeat visits, short enough that a replaced
    # image shows up within a week. Rename a file to bust caches sooner.
    location ~* \.(?:png|webp|avif|jpe?g|gif|svg|ico|mp4|webm|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
